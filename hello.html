<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이름 입력</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            font-size: 28px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        input {
            width: 220px;
            height: 55px;
            font-size: 28px;
            padding: 5px 10px;
        }

        button {
            height: 65px;
            padding: 0 30px;
            font-size: 28px;
            cursor: pointer;
        }

        #result {
            font-size: 28px;
        }
    </style>
</head>

<body>

    <div class="row">
        <label for="nameInput">이름</label>

        <input
            type="text"
            id="nameInput"
        >

        <button onclick="showName()">
            입력
        </button>
    </div>

    <p id="result">
        당신의 이름은 _____ 입니다.
    </p>


    <script>
        function showName() {
            const name = document.getElementById("nameInput").value;

            document.getElementById("result").innerText =
                "당신의 이름은 " + name + " 입니다.";
        }
    </script>

</body>
</html>
